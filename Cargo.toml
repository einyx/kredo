[workspace]
resolver = "2"
members = [
    "crates/kredo",
    "crates/kredo-api",
    "crates/kredo-decision",
    "crates/kredo-lang",
    "crates/kredo-registry",
    "crates/kredo-runner",
    "crates/kredo-server",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kredo-api = { path = "crates/kredo-api" }
kredo-decision = { path = "crates/kredo-decision" }
kredo-lang = { path = "crates/kredo-lang" }
kredo-registry = { path = "crates/kredo-registry" }
kredo-runner = { path = "crates/kredo-runner" }
kredo-server = { path = "crates/kredo-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "timeout", "limit", "request-id", "trace"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
subtle = "2"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig", "progressbar"] }
ndarray = "0.16"

[profile.release]
lto = "thin"
strip = true
