# Production-ish single-node deployment:
#   docker compose up -d
# API on http://localhost:21435 behind the health-checked container.
services:
  jeff:
    build: .
    image: jeff:local
    restart: unless-stopped
    ports:
      - "21435:21435"
    environment:
      # Set a real key when exposing beyond localhost:
      KREDO_API_KEY: ${KREDO_API_KEY:-}
      KREDO_RATE_LIMIT: "120"
      KREDO_MAX_CONCURRENCY: "4"
      KREDO_LOG_FORMAT: "json"
      # TLS (mount certs and set host accordingly):
      # KREDO_TLS_CERT: /certs/fullchain.pem
      # KREDO_TLS_KEY: /certs/privkey.pem
    volumes:
      - jeff-models:/data/models
    healthcheck:
      test: ["CMD", "kredo", "status"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  jeff-models:
